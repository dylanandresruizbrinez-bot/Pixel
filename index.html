<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="menu">

        <div class="section">
            <button id="shopButton">🛒 Tienda</button>
        </div>

        <div class="section">
            <label>Color</label>
            <select id="colorSelect">
                <option value="white">Blanco</option>
            </select>
        </div>

        <div class="section">
            <label>Diseño</label>
            <select id="designSelect">
                <option value="normal">Esquinas</option>
            </select>
        </div>

        <div class="section">
            <label>Caminos</label>
            <select id="trailSelect">
                <option value=".">.</option>
            </select>
        </div>

    </div>

    <div id="pointsPanel">
        Puntos: <span id="points">0</span>
    </div>

    <div id="notificationContainer"></div>

    <div id="shop">

        <h2>Tienda</h2>

        <div id="shopContent"></div>

        <button id="closeShop">Cerrar</button>

    </div>

    <div id="speechBubble"></div>

    <div id="trailContainer"></div>

    <div id="player"></div>

    <script src="script.js"></script>

</body>
</html>
