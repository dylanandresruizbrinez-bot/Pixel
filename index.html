<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="menu">
    
    <div class="section">
        <label>Color</label>
        <select id="colorSelect">
            <option value="white">Blanco</option>
            <option value="blue">Azul</option>
            <option value="yellow">Amarillo</option>
            <option value="red">Rojo</option>
            <option value="green">Verde</option>
            <option value="orange">Naranja</option>
            <option value="purple">Morado</option>
            <option value="black">Negro</option>
            <option value="gray">Gris</option>
            <option value="gold">Dorado</option>
            <option value="pink">Rosa</option>
        </select>
    </div>

    <div class="section">
        <label>Diseño</label>
        <select id="designSelect">
            <option value="normal">Esquinas</option>
            <option value="round">Redondez</option>
            <option value="border">Borde</option>
            <option value="dots">Puntos</option>
            <option value="stripes">Rayas</option>
            <option value="spikes">Picos</option>
        </select>
    </div>

    <div class="section">
        <label>Caminos</label>
        <select id="trailSelect">
            <option value=".">.</option>
            <option value=":">:</option>
            <option value="(">(</option>
            <option value="-">-</option>
            <option value="67">67</option>
            <option value="F">F</option>
            <option value="I">I</option>
            <option value="o">o</option>
            <option value='"'>"</option>
        </select>
    </div>

</div>
<div id="speechBubble"></div>
<div id="trailContainer"></div>
<div id="player"></div>
<div id="player"></div>
    <script src="script.js"></script>
</body>
</html>
